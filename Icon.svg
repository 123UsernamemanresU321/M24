<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Maths24 icon">
  <defs>
    <radialGradient id="g" cx="35%" cy="30%" r="85%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f5ff"/>
    </radialGradient>

    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b1220" flood-opacity="0.25"/>
    </filter>

    <path id="ringPath" d="M64,16 A48,48 0 1,1 63.999,16 Z"/>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="108" height="108" rx="24" fill="url(#g)" filter="url(#s)"/>

  <!-- Outer dial -->
  <circle cx="64" cy="64" r="41" fill="none" stroke="#1a2a52" stroke-width="6" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="34" fill="none" stroke="#1a2a52" stroke-width="2.5" opacity="0.22"/>

  <!-- Cardinal ticks -->
  <line x1="64" y1="20" x2="64" y2="30" stroke="#1a2a52" stroke-width="4" stroke-linecap="round"/>
  <line x1="108" y1="64" x2="98" y2="64" stroke="#1a2a52" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="108" x2="64" y2="98" stroke="#1a2a52" stroke-width="4" stroke-linecap="round"/>
  <line x1="20" y1="64" x2="30" y2="64" stroke="#1a2a52" stroke-width="4" stroke-linecap="round"/>

  <!-- Minimal arithmetic glyphs -->
  <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="10" fill="#1a2a52" opacity="0.9">
    <textPath href="#ringPath" startOffset="12%">+</textPath>
  </text>
  <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="10" fill="#1a2a52" opacity="0.9">
    <textPath href="#ringPath" startOffset="36%">−</textPath>
  </text>
  <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="10" fill="#1a2a52" opacity="0.9">
    <textPath href="#ringPath" startOffset="60%">×</textPath>
  </text>
  <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="10" fill="#1a2a52" opacity="0.9">
    <textPath href="#ringPath" startOffset="84%">÷</textPath>
  </text>

  <!-- Center badge -->
  <circle cx="64" cy="64" r="26" fill="#ffffff" stroke="#1a2a52" stroke-width="3"/>

  <!-- "24" (nudged upward for visual centering) -->
  <text x="64" y="75"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial"
        font-size="34"
        font-weight="800"
        fill="#1a2a52"
        letter-spacing="1">24</text>
</svg>
